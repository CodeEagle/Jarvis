name: macos-app

# Builds the SwiftUI desktop app on a real macOS runner. Triggered by
# changes under desktop/macos/ + crates/** (jarvis-cli is bundled into
# the .app), or by manual workflow_dispatch.
#
# The build is unsigned (no Apple Developer account in CI). Users
# downloading the artifact will need to clear the Gatekeeper quarantine
# attribute — see desktop/macos/README.md.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'desktop/macos/**'
      - '.github/workflows/macos-app.yml'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read

jobs:
  build:
    name: build JarvisMac (universal, unsigned)
    runs-on: macos-14
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # ── Rust: build jarvis-cli for both arches and lipo together ──
      # The .app embeds a universal jarvis binary at
      # Contents/MacOS/jarvis so the app can spawn `jarvis serve` on
      # launch without asking the user to install anything.
      - name: Install Rust toolchain (universal targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-app-jarvis-cli

      - name: Build jarvis-cli (arm64 + x86_64 → universal)
        run: |
          set -euo pipefail
          cargo build --release --locked -p jarvis-cli --target aarch64-apple-darwin
          cargo build --release --locked -p jarvis-cli --target x86_64-apple-darwin
          mkdir -p desktop/macos/embed
          lipo -create \
            target/aarch64-apple-darwin/release/jarvis \
            target/x86_64-apple-darwin/release/jarvis \
            -output desktop/macos/embed/jarvis
          chmod +x desktop/macos/embed/jarvis
          file desktop/macos/embed/jarvis
          ls -lh desktop/macos/embed/jarvis

      # ── SwiftUI: generate xcodeproj then build .app ───────────────
      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: desktop/macos
        run: xcodegen generate

      - name: Build (Release, unsigned)
        working-directory: desktop/macos
        run: |
          set -euo pipefail
          set -o pipefail
          # `| xcpretty` filters output but the real exit code must
          # propagate via `set -o pipefail`; do NOT add `|| true`.
          xcodebuild \
            -project Jarvis.xcodeproj \
            -scheme JarvisMac \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            CODE_SIGN_ENTITLEMENTS= \
            build | xcpretty

      - name: Locate built .app
        id: locate
        working-directory: desktop/macos
        run: |
          set -euo pipefail
          APP_PATH=$(find build/Build/Products/Release -maxdepth 2 -name '*.app' | head -1)
          if [[ -z "$APP_PATH" ]]; then
            echo "::error::no .app bundle found under build/Build/Products/Release"
            ls -R build/Build/Products || true
            exit 1
          fi
          # Emit absolute paths so downstream steps don't care which
          # working-directory they happen to run from.
          APP_PATH=$(realpath "$APP_PATH")
          echo "Found: $APP_PATH"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "app_dir=$(dirname "$APP_PATH")" >> "$GITHUB_OUTPUT"
          echo "app_name=$(basename "$APP_PATH")" >> "$GITHUB_OUTPUT"

      # ── Inject the universal Rust binary into the bundle ──────────
      - name: Embed jarvis binary into .app/Contents/MacOS/
        working-directory: desktop/macos
        run: |
          set -euo pipefail
          APP="${{ steps.locate.outputs.app_path }}"
          cp embed/jarvis "$APP/Contents/MacOS/jarvis"
          chmod +x "$APP/Contents/MacOS/jarvis"
          ls -lh "$APP/Contents/MacOS/"
          file "$APP/Contents/MacOS/jarvis"

      - name: Zip .app bundle
        run: |
          set -euo pipefail
          cd "${{ steps.locate.outputs.app_dir }}"
          ditto -c -k --keepParent "${{ steps.locate.outputs.app_name }}" "$GITHUB_WORKSPACE/JarvisMac.zip"
          ls -lh "$GITHUB_WORKSPACE/JarvisMac.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JarvisMac-${{ github.sha }}
          path: ${{ github.workspace }}/JarvisMac.zip
          retention-days: 30
          if-no-files-found: error
