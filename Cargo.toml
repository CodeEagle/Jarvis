[workspace]
resolver = "2"
members = [
    "crates/jarvis-core",
    "crates/jarvis-db",
    "crates/jarvis-router",
    "crates/jarvis-memory",
    "crates/jarvis-control",
    "crates/jarvis-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
once_cell = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"

jarvis-core   = { path = "crates/jarvis-core" }
jarvis-db     = { path = "crates/jarvis-db" }
jarvis-router = { path = "crates/jarvis-router" }
jarvis-memory = { path = "crates/jarvis-memory" }
jarvis-control = { path = "crates/jarvis-control" }

[profile.release]
lto = "thin"
codegen-units = 1
