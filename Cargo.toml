[workspace]
resolver = "2"
members = [
    "crates/jarvis-core",
    "crates/jarvis-db",
    "crates/jarvis-router",
    "crates/jarvis-memory",
    "crates/jarvis-tools",
    "crates/jarvis-growth",
    "crates/jarvis-orchestrator",
    "crates/jarvis-control",
    "crates/jarvis-api",
    "crates/jarvis-anthropic",
    "crates/jarvis-openai",
    "crates/jarvis-codex",
    "crates/jarvis-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
once_cell = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

jarvis-core         = { path = "crates/jarvis-core" }
jarvis-db           = { path = "crates/jarvis-db" }
jarvis-router       = { path = "crates/jarvis-router" }
jarvis-memory       = { path = "crates/jarvis-memory" }
jarvis-tools        = { path = "crates/jarvis-tools" }
jarvis-growth       = { path = "crates/jarvis-growth" }
jarvis-orchestrator = { path = "crates/jarvis-orchestrator" }
jarvis-control      = { path = "crates/jarvis-control" }
jarvis-api          = { path = "crates/jarvis-api" }
jarvis-anthropic    = { path = "crates/jarvis-anthropic" }
jarvis-openai       = { path = "crates/jarvis-openai" }
jarvis-codex        = { path = "crates/jarvis-codex" }

[profile.release]
lto = "thin"
codegen-units = 1
