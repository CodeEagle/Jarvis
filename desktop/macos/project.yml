# xcodegen config — `brew install xcodegen && xcodegen` regenerates
# Jarvis.xcodeproj from this file. Keep all build settings here so the
# generated project stays disposable and merge-conflict-free.

name: Jarvis

options:
  bundleIdPrefix: ai.jarvis
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    ENABLE_HARDENED_RUNTIME: NO

targets:
  JarvisMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/JarvisMac
    info:
      path: Sources/JarvisMac/Info.generated.plist
      properties:
        CFBundleName: Jarvis
        CFBundleDisplayName: Jarvis
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "13.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSHighResolutionCapable: true
        NSMicrophoneUsageDescription: "Jarvis 需要麦克风权限来接收语音输入。所有处理都在本机完成，音频不会上传。"
        NSSpeechRecognitionUsageDescription: "Jarvis 使用本机语音识别将你的语音转成文本，无网络上传。"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.jarvis.mac
        PRODUCT_NAME: Jarvis
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
